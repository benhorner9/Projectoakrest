name: Oakrest visual fidelity QA

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  browser-visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p qa
      - run: node tests/visual-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oakrest-graphics-smoke-evidence
          path: qa/
          if-no-files-found: ignore
          retention-days: 7

  legacy-gameplay-browser:
    # Existing gameplay regression suite runs separately so failures do not
    # disguise whether the new visual rendering itself works.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p qa
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oakrest-legacy-gameplay-evidence
          path: qa/
          if-no-files-found: ignore
          retention-days: 7
