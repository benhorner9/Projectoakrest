name: Oakrest Classic — UI and town cleanup acceptance
on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/classic-skills-ui.js'
      - 'src/classic-map-popup.js'
      - 'src/classic-prototype.js'
      - 'src/classic-quest-journal.js'
      - 'src/classic-item-state.js'
      - 'src/classic-items-ui.js'
      - 'src/classic-cleanup.css'
      - 'src/classic-town-plan.js'
      - 'src/town-layout.js'
      - 'src/classic-terrain-view.js'
      - 'src/classic-minimap.js'
      - 'classic.html'
      - 'tests/browser-classic-ui-cleanup.cjs'
      - '.github/workflows/classic-ui-cleanup-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classic-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && npm run build
      - run: npx playwright install chromium
      - name: Touch Chromium — complete Director UX acceptance
        run: timeout --signal=TERM --kill-after=10s 5m node tests/browser-classic-ui-cleanup.cjs
      - name: Existing adventure and Classic map regression
        run: |
          timeout --signal=TERM --kill-after=10s 5m node tests/browser-adventure.cjs
          timeout --signal=TERM --kill-after=10s 4m node tests/browser-classic-world-atlas.cjs
