name: Oakrest complete building audit

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/town-world.js'
      - 'src/building-art.js'
      - 'src/bank-architecture.js'
      - 'src/trade-house-art.js'
      - 'src/building-visibility.js'
      - 'src/town-layout.js'
      - 'tests/building-shell-completion.test.js'
      - 'tests/browser-building-completion.cjs'
      - '.github/workflows/building-completion-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  building-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Structural shell tests for all 16 buildings
        run: node --test tests/building-shell-completion.test.js tests/building-cutaway.test.js tests/building-finish.test.js
      - run: npm run check
      - run: npm run build
      # Core and bank validate Chromium against the preinstalled runner libraries.
      # Avoid unbounded apt mirror provisioning consuming the building test budget.
      - run: timeout --signal=TERM --kill-after=10s 3m npx playwright install chromium
      - name: Capture each facade corner and interior at iPad-size viewport
        run: OAKREST_BUILDING_SHARD=${{ matrix.shard }} timeout --signal=TERM --kill-after=10s 10m node tests/browser-rebirth-world.cjs
      - name: Preserve 48 building audit screenshots and failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oakrest-complete-building-audit-shard-${{ matrix.shard }}
          path: qa/building-completion/
          if-no-files-found: ignore
          retention-days: 14
