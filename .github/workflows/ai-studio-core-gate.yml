name: Oakrest AI Studio Core Gate

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oakrest-ai-studio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-quality:
    name: Core QA — parse, unit, build, Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate source
        run: npm run check
      - name: Run unit and regression tests
        run: npm test
      - name: Audit visual asset contracts
        run: npm run audit:visuals
      - name: Build static release
        run: npm run build
      - name: Install Chromium using preinstalled runner system libraries
        # Avoid apt mirror download stalls; other suites validate the same runner setup.
        run: npx playwright install chromium
      - name: Classic direct-launch smoke
        run: node tests/browser-classic-dev-launch.cjs
      - name: Classic directional character motion
        run: timeout --signal=TERM --kill-after=10s 3m node tests/browser-rebirth-sprites.cjs
      - name: Classic village, walls and interior regression
        run: timeout --signal=TERM --kill-after=10s 5m node tests/browser-rebirth-world.cjs
      - name: Classic equipment, drag and quick-slot regression
        run: timeout --signal=TERM --kill-after=10s 3m node tests/browser-classic-equipment-ui.cjs
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oakrest-ai-core-qa
          path: qa/
          if-no-files-found: ignore

  candidate-playtest:
    name: Classic candidate — complete adventure and save compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - name: Complete Classic adventure in simulation
        run: timeout --signal=TERM --kill-after=10s 4m node tests/browser-adventure-complete.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oakrest-candidate-gameplay
          path: qa/foundation-gameplay/
          if-no-files-found: ignore

# This *fast* signal does not replace the existing comprehensive Greenwood
# workflow, iPad Safari signoff, or shared-host dev release verification.
