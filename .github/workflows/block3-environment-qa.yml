name: Oakrest Block 3 — town environment and collision QA
on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/classic-presentation.js'
      - 'src/classic-interior-fixtures.js'
      - 'src/classic-art-direction.js'
      - 'src/classic-world-life.js'
      - 'src/classic-village.js'
      - 'tests/classic-town-life.test.js'
      - 'tests/classic-block3-environment.test.js'
      - 'tests/browser-classic-block3.cjs'
      - '.github/workflows/block3-environment-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  environment:
    name: Block 3 — unit/build, collision and real Classic Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && npm run build
      - run: npx playwright install chromium
      - name: Visit bank and verify moving civilians in touch Chromium
        run: timeout --signal=TERM --kill-after=10s 5m node tests/browser-classic-block3.cjs
      - name: Regression — world navigation and quest access
        run: timeout --signal=TERM --kill-after=10s 5m node tests/browser-classic-navigation.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oakrest-block3-environment-evidence
          path: qa/block3/
