name: Oakrest HUD Minimap QA

on:
  pull_request:
    branches: [dev]
    paths:
      - 'index.html'
      - 'src/minimap.js'
      - 'src/main.js'
      - 'src/hud-minimap.css'
      - 'tests/minimap*.js'
      - 'tests/minimap*.cjs'
      - '.github/workflows/hud-minimap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  hud-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/minimap-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oakrest-minimap-screenshots
          path: qa/
          if-no-files-found: ignore
          retention-days: 7
