name: Oakrest Greenwood QA

on:
  pull_request:
    branches: [main, overhaul/greenwood-gameplay-visuals, feature/oakrest-town-and-specialist-training]
  push:
    branches: [overhaul/greenwood-gameplay-visuals, feature/oakrest-town-and-specialist-training, feature/oakrest-equipment-inventory-starter-sets]

permissions:
  contents: read

jobs:
  regression-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate source
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: Production asset build
        run: npm run build
      - name: Install Chromium and dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: node tests/browser-smoke.cjs
      - name: Town bank, shop and specialist skilling in Chromium
        run: node tests/browser-town.cjs
      - name: Equipment, inventory Examine and starter item persistence
        run: node tests/browser-equipment.cjs
      - name: iPad-size dev-path character start regression
        run: node tests/browser-ipad-creator.cjs
      - name: iPad-size controller and camera regression
        run: node tests/browser-controller.cjs
