name: Oakrest Greenwood QA

on:
  pull_request:
    branches: [main, dev, overhaul/greenwood-gameplay-visuals, feature/oakrest-town-and-specialist-training]
  push:
    branches: [dev, overhaul/greenwood-gameplay-visuals, feature/oakrest-town-and-specialist-training, feature/oakrest-equipment-inventory-starter-sets]

permissions:
  contents: read

jobs:
  regression-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate source
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: Production asset build
        run: npm run build
      - name: Install browser engines and dependencies
        id: browsers
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node tests/browser-smoke.cjs
      - name: Town bank, shop and specialist skilling in Chromium
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node tests/browser-town.cjs
      - name: Equipment, inventory Examine and starter item persistence
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node tests/browser-equipment.cjs
      - name: iPad-size dev-path character start regression
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node tests/browser-ipad-creator.cjs
      - name: iPad-size controller and camera regression
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node tests/browser-controller.cjs
      - name: Combat Reborn real simulation scenarios
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node tests/browser-combat-reborn.cjs
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oakrest-release-qa
          path: qa/
          if-no-files-found: ignore

  built-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Built dev-path release flow
        run: node tests/browser-release.cjs
      - name: WebKit development-path release flow
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p qa
          set -o pipefail
          OAKREST_BROWSER=webkit timeout 180s node tests/browser-release.cjs 2>&1 | tee qa/webkit.log
      - name: Preserve release screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oakrest-built-release-qa
          path: |
            qa/*.png
            qa/*.log
          if-no-files-found: ignore
