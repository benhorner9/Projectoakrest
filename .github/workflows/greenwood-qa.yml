name: Oakrest Greenwood QA

on:
  pull_request:
    branches: [main, dev, overhaul/greenwood-gameplay-visuals, feature/oakrest-town-and-specialist-training]
  push:
    branches: [dev, overhaul/greenwood-gameplay-visuals, feature/oakrest-town-and-specialist-training, feature/oakrest-equipment-inventory-starter-sets]

permissions:
  contents: read

jobs:
  regression-and-browser:
    runs-on: ubuntu-latest
    # Ubuntu apt mirrors can add ~10 minutes to a clean Chromium install; the
    # full smoke/town/woodcutting/equipment/iPad/controller matrix adds ~7 more.
    # Preserve the complete integration signal instead of cancelling it mid-test.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate source
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: Classic development release build
        run: npm run build
      - name: Install Chromium using runner system libraries
        id: browsers
        # Same validated setup as core, bank and release jobs; no apt mirror stall.
        run: timeout --signal=TERM --kill-after=10s 3m npx playwright install chromium
      - name: Browser smoke test
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node tests/browser-classic-dev-launch.cjs
      - name: Classic town, cutaway and woodland rendering
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node tests/browser-rebirth-world.cjs
      - name: Classic adventure walkthrough
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node tests/browser-adventure.cjs
      - name: Classic equipment, inventory drag and quick slots
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node tests/browser-classic-equipment-ui.cjs
      - name: Classic iPad-size character creation
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node tests/browser-classic-creator.cjs
      - name: Classic elevated camera and direction controls
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node tests/browser-classic-camera.cjs
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oakrest-release-qa
          path: qa/
          if-no-files-found: ignore

  combat-browser:
    name: Classic combat scenario audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout all history for baseline parity
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # Ubuntu hosted runners already contain Chromium shared libraries; avoid apt mirror stalls.
      - run: npx playwright install chromium
      - name: Exercise all rendered combat scenarios with bounded runtime
        run: timeout --signal=TERM --kill-after=10s 12m node tests/browser-classic-combat-overhaul.cjs
      - name: Classic character motion and combat feedback
        run: timeout --signal=TERM --kill-after=10s 3m node tests/browser-rebirth-feedback.cjs
      - name: Integrated contact effects and expiry
        run: timeout --signal=TERM --kill-after=10s 3m node tests/browser-classic-combat-impacts.cjs
      - name: Preserve combat scenario diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oakrest-combat-scenario-qa
          path: qa/
          if-no-files-found: ignore

  auto-combat-and-performance:
    name: Classic combat and navigation integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout all history for baseline comparison
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # Depend on hosted runner's existing shared libraries; avoid apt mirror stalls.
      - run: npx playwright install chromium
      - name: Auto combat and three-style switch regression
        run: timeout --signal=TERM --kill-after=10s 6m node tests/browser-classic-free-combat.cjs
      - name: Classic movement/navigation regression
        run: timeout --signal=TERM --kill-after=10s 7m node tests/browser-classic-navigation.cjs
      - name: Preserve performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oakrest-combat-performance-qa
          path: qa/
          if-no-files-found: ignore

  built-release:
    runs-on: ubuntu-latest
    # Browser-engine installs can consume several minutes on busy runners.
    # Keep an explicit bounded gameplay step instead of killing the whole job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Runner system libraries are already available; provisioning apt fonts can timeout.
      - run: npx playwright install chromium webkit
      - name: Built Classic direct-launch flow
        run: timeout --signal=TERM --kill-after=10s 9m node tests/browser-classic-dev-launch.cjs
      - name: WebKit Classic direct-launch diagnostic
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p qa
          set -o pipefail
          OAKREST_BROWSER=webkit timeout 180s node tests/browser-classic-dev-launch.cjs 2>&1 | tee qa/webkit.log
      - name: Classic launch under simulated WebKit iPad
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p qa
          set -o pipefail
          OAKREST_BROWSER=webkit timeout 180s node tests/browser-rebirth-feedback.cjs 2>&1 | tee qa/webkit-animation-inspector.log
      - name: Preserve release screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oakrest-built-release-qa
          path: |
            qa/*.png
            qa/*.log
          if-no-files-found: ignore
