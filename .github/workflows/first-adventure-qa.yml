name: First Adventure playable regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adventure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && npm run build
      - run: npx playwright install chromium
      - run: node tests/browser-adventure.cjs
      - run: node tests/browser-classic-framed.cjs
      - run: node tests/browser-classic-rebirth-v2.cjs
      - run: node tests/browser-classic-free-combat.cjs
      - run: node tests/browser-classic.cjs && node tests/browser-classic-save.cjs && node tests/browser-classic-hud.cjs && node tests/browser-classic-creator.cjs && node tests/browser-classic-camera.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-adventure-playtest
          path: qa/
