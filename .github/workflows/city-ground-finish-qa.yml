name: Oakrest city ground finish QA

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/town-ground.js'
      - 'src/town-world.js'
      - 'src/terrain.js'
      - 'src/town-layout.js'
      - 'tests/town-ground-finish.test.js'
      - 'tests/browser-city-ground.cjs'
      - '.github/workflows/city-ground-finish-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  city-ground:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify paving coverage, wildflower placement and all building entrances
        run: node --test tests/town-ground-finish.test.js tests/building-shell-completion.test.js tests/town-placement.test.js
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture roads and meadows at iPad landscape viewport
        run: timeout --signal=TERM --kill-after=10s 9m node tests/browser-city-ground.cjs
      - name: Preserve town surface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oakrest-city-ground-review
          path: qa/city-ground/
          if-no-files-found: ignore
          retention-days: 14
