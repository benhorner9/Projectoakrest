name: Oakrest Classic — visual Block 1 world acceptance
on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/classic-block1-*'
      - 'src/classic-village.js'
      - 'src/classic-terrain-view.js'
      - 'src/classic-art-direction.js'
      - 'src/adventure-world.js'
      - 'src/classic-prototype.js'
      - 'tests/classic-visual-block1.test.js'
      - 'tests/browser-classic-visual-block1.cjs'
      - '.github/workflows/classic-visual-block1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  block1:
    name: Classic terrain, buildings, foliage and iPad-sized Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && npm run build
      - run: npx playwright install chromium
      - name: iPad-sized Classic WebGL visual / doorway regression
        run: timeout --signal=TERM --kill-after=10s 5m node tests/browser-classic-visual-block1.cjs
      - name: Existing live bank, forest and renderer regression
        run: timeout --signal=TERM --kill-after=10s 5m node tests/browser-classic-block3.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oakrest-classic-visual-block1-evidence
          path: qa/visual-block1/
          if-no-files-found: ignore
