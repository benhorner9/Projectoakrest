name: Oakrest Rebirth acceptance
on:
  pull_request:
    branches: [dev, 'ai/tech/109-classic-integration', 'ai/rebirth/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classic-journeys:
    name: Classic / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [classic, classic-navigation, classic-camera, classic-creator, classic-free-combat, classic-combat-overhaul, classic-combat-impacts, classic-combat-engagement, classic-abilities, classic-equipment-ui, classic-framed, classic-hud, classic-save, adventure, rebirth-world, rebirth-sprites, rebirth-touch, rebirth-feedback, adventure-complete]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && npm run build
      - run: npx playwright install chromium
      - run: timeout --signal=TERM --kill-after=10s 6m node tests/browser-${{ matrix.suite }}.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebirth-${{ matrix.suite }}
          path: qa/
          if-no-files-found: ignore
